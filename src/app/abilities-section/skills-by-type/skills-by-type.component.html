<h3 class="text-lg mb-1 text-gray-800">{{ typeLabel() }}</h3>
<div class="flex flex-wrap gap-2 print:gap-1">
  @for (skill of skills(); track skill) {
    <span class="px-3 py-1 bg-gray-100 hover:bg-gray-300 rounded-full text-sm font-medium print:px-2 print:py-0.5 print:text-xs print:border">
                  {{ skill }}
                </span>
  }
</div>
